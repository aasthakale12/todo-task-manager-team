<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List & Task Manager</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-shape shape-one"></div>
  <div class="bg-shape shape-two"></div>
  <div class="bg-shape shape-three"></div>

  <main class="page">
    <section class="dashboard-card">
      <div class="top-section">
        <div>
          <p class="eyebrow">Day 3 Prototype</p>
          <h1>To-Do List & Task Manager</h1>
          <p class="subtitle">
            Organize, search, edit, filter, and complete your daily tasks in one clean productivity dashboard.
          </p>
        </div>

        <div class="mini-panel">
          <span class="mini-label">Version</span>
          <strong>Task Dashboard V3</strong>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card stat-total">
          <span>Total Tasks</span>
          <strong id="totalCount">0</strong>
        </div>
        <div class="stat-card stat-active">
          <span>Active</span>
          <strong id="activeCount">0</strong>
        </div>
        <div class="stat-card stat-completed">
          <span>Completed</span>
          <strong id="completedCount">0</strong>
        </div>
      </div>

      <div class="input-card">
        <div class="task-controls">
          <input
            type="text"
            id="taskInput"
            placeholder="Enter your task..."
            aria-label="Task input"
          />

          <select id="prioritySelect" aria-label="Task priority">
            <option value="Low">Low Priority</option>
            <option value="Medium" selected>Medium Priority</option>
            <option value="High">High Priority</option>
          </select>

          <button id="addTaskBtn">Add Task</button>
        </div>

        <div class="toolbar">
          <input
            type="text"
            id="searchInput"
            placeholder="Search tasks..."
            aria-label="Search tasks"
          />

          <div class="filter-buttons">
            <button class="filter-btn active-filter" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
          </div>
        </div>

        <p id="helperText" class="helper-text">
          Add, edit, search, and filter your tasks.
        </p>
      </div>

      <ul id="taskList" class="task-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
