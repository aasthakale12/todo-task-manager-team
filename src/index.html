<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List & Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-glow glow-one"></div>
  <div class="page-glow glow-two"></div>

  <main class="container">
    <section class="app-card">
      <p class="eyebrow">Day 2 Prototype</p>
      <h1>To-Do List & Task Manager</h1>
      <p class="subtitle">
        Organize your day, complete tasks, and manage your priorities with a clean and modern interface.
      </p>

      <div class="task-input">
        <input
          type="text"
          id="taskInput"
          placeholder="Enter a new task..."
          aria-label="Task input"
        />
        <button id="addTaskBtn">Add Task</button>
      </div>

      <p id="helperText" class="helper-text">Add a task and manage it using Complete or Delete.</p>

      <ul id="taskList" class="task-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
